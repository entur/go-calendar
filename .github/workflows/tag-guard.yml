# Audits every v* tag: each must point at a release-please release commit on
# main whose version matches the tag name. Runs on tag push when that event
# is delivered, daily from the default branch, on demand from main, and from
# the release workflow after it creates a tag (a GITHUB_TOKEN tag push does
# not trigger workflows). It reads the GitHub API only and never executes
# code from the tags it inspects. This detects stray tags after creation;
# it does not prevent them from being published or consumed.
name: Tag guard

on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "41 5 * * *" # daily
  workflow_dispatch:
  workflow_call:

permissions: {}

jobs:
  audit:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Audit v* tags
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          fail=0
          refs="$(gh api --paginate "repos/${REPO}/git/matching-refs/tags/v" \
            --jq '.[] | [.ref, .object.type, .object.sha] | @tsv')"
          while IFS=$'\t' read -r ref type sha; do
            [ -n "${ref}" ] || continue
            tag="${ref#refs/tags/}"
            if [ "${type}" = "tag" ]; then
              sha="$(gh api "repos/${REPO}/git/tags/${sha}" --jq '.object.sha')"
            fi
            version="${tag#v}"
            if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::tag ${tag} is not a release version tag"
              fail=1
              continue
            fi
            subject="$(gh api "repos/${REPO}/commits/${sha}" --jq '.commit.message | split("\n") | .[0]')"
            expected="^chore\(main\): release ${version//./\\.}( \(#[0-9]+\))?\$"
            if ! [[ "${subject}" =~ ${expected} ]]; then
              echo "::error::tag ${tag} (${sha}) does not point at the release-please commit for ${version}"
              fail=1
              continue
            fi
            status="$(gh api "repos/${REPO}/compare/main...${sha}" --jq '.status')"
            if [ "${status}" != "behind" ] && [ "${status}" != "identical" ]; then
              echo "::error::tag ${tag} (${sha}) is not on main (${status})"
              fail=1
              continue
            fi
            echo "tag ${tag} -> ${sha}: ok"
          done <<< "${refs}"
          exit "${fail}"

  notify:
    needs: audit
    if: failure()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open an issue for the maintainers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --title "Tag audit failed" --body "A v* tag does not point at a release-please release commit on main. See ${RUN_URL}. Investigate before anyone consumes it, and retract the version if needed (tags are never moved or deleted)."
