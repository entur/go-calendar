name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # No checkout: release-please works through the GitHub API, so no
      # repository code runs with this job's write token.
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  verify-module:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GOTOOLCHAIN: local
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: Module hash through proxy.golang.org equals the tagged tree
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          # Downloading through the proxy also records the version in
          # sum.golang.org.
          proxy_sum="$(cd "${tmp}" && GOFLAGS=-mod=mod GOPROXY=https://proxy.golang.org GOSUMDB=sum.golang.org \
            go mod download -json "github.com/entur/go-calendar@${TAG}" | jq -r .Sum)"
          tree_sum="$(go -C tools tool modhash -module github.com/entur/go-calendar -version "${TAG}" -rev "${TAG}" ..)"
          echo "proxy.golang.org: ${proxy_sum}"
          echo "tagged tree:      ${tree_sum}"
          test "${proxy_sum}" = "${tree_sum}"
      - name: Release is immutable
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release verify "${TAG}"

  # A tag created with GITHUB_TOKEN does not trigger tag-guard.yml's push
  # event, so the release audits all tags explicitly.
  tag-audit:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      issues: write
    # "./" runs the called workflow from the caller's commit, the same as
    # "$/" for a same-repository call; actionlint 1.7.12 rejects "$/".
    uses: ./.github/workflows/tag-guard.yml # zizmor: ignore[self-repository]
